name: Grafische Fahrplaene Verzeichnis

# Erkundung (Schritt E): Jahresverzeichnis GZVJ und Listenseiten nachsehen,
# MGB/zb suchen. Ergebnis als erkundung_verzeichnis.json ins Release grafapla-2026.
on:
  workflow_dispatch:
  push:
    branches: [grafapla-e]
    paths:
      - ".github/workflows/grafapla-verzeichnis.yml"
      - "tools/grafapla_verzeichnis.py"

permissions:
  contents: write

jobs:
  nachsehen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf openpyxl
      - run: |
          B=https://www.oev-info.ch/sites/default/files/grafapla
          python tools/grafapla_verzeichnis.py erkundung_verzeichnis.json --nur-pdfs --pdfs \
            $B/2023/GZVJ.pdf $B/2022/07.061.pdf $B/2025/GMGBS.pdf $B/2025/GMGBW.pdf $B/2025/GDB1.pdf \
            $B/2025/GBOB.pdf $B/2025/GMOB.pdf $B/2026/GCJ.pdf
      - name: Ins Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload grafapla-2026 erkundung_verzeichnis.json --clobber
